services:
  postgres:
    image: postgres:17
    container_name: manutencao-industrial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manutencao_industrial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d

volumes:
  postgres_dados: